    <circle cx="304" cy="5" r="3.5" fill="#EF4444"/>
    <circle cx="335" cy="9" r="2" fill="#475569"/>
    <circle cx="335" cy="15" r="2" fill="#475569"/>
    <circle cx="335" cy="21" r="2" fill="#475569"/>
  </g>
  
  <!-- Saldo Card -->
  <g id="Card-Saldo" transform="translate(20, 105)">
