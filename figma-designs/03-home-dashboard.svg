      <g id="Nav-Beranda" transform="translate(48, 765)" style="cursor: pointer;">
        <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" fill="none" stroke="#107548" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-10, -5) scale(0.9)"/>
        <text x="0" y="22" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="600" fill="#107548" text-anchor="middle">Beranda</text>
      </g>
    
      <g id="Nav-Transaksi" transform="translate(144, 765)" style="cursor: pointer;">
        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-10, -5) scale(0.9)"/>
        <text x="0" y="22" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">Transaksi</text>
      </g>
    
      <g id="Nav-Laporan" transform="translate(240, 765)" style="cursor: pointer;">
        <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-10, -5) scale(0.9)"/>
        <text x="0" y="22" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">Laporan</text>
      </g>
    
      <g id="Nav-Akun" transform="translate(336, 765)" style="cursor: pointer;">
        <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-10, -5) scale(0.9)"/>
        <text x="0" y="22" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">Akun</text>
      </g>
    
      
  <g id="Home-Indicator">
    <rect x="130" y="828" width="130" height="4" rx="2" fill="#CBD5E1"/>
